<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>我之所以是我 作品導覽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 手機優先的單欄導覽;桌機把格子拉成 3–4 欄、作品頁分左右兩欄。
   視覺為單一風格(深咖啡底 + 撕紙牛皮色),首頁用奶油色。 */
:root{
  --ink:#2b1f17;          /* 撕紙上的深字 */
  --paper:#f1dac6;        /* 撕紙頁首 */
  --paper-2:#e6c9a6;      /* 標籤紙 */
  --cream:#fbe8d5;        /* 首頁底 */
  --card:#f8e0cb;         /* 首頁卡片 */
  --brown:#8a5a2b;        /* 搜尋鈕 */
  --night:#382d27;        /* 內頁底 */
  --night-2:#2a2420;      /* 作品展示底 */
  --text:#f3e6d6;
  --muted:#c9b8a6;
  --line:rgba(243,230,214,.28);
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-brush:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--night);color:var(--text);font-family:var(--font-body);
  font-size:16px;line-height:1.7;min-height:100vh;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 5px);
}
body[data-route="home"]{background:var(--cream);background-image:none;color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
body[data-route="home"]::before{background:var(--cream)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid #f0b36b;outline-offset:3px;border-radius:6px}
svg{display:block}
.wrap{width:100%;max-width:1040px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== 撕紙頁首 ===== */
:root{--te:clamp(26px,3.4vw,52px);--th:calc(76px + var(--te))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--th);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.top-bg{position:absolute;left:0;right:0;top:0;bottom:calc(var(--te) - 1px);background:linear-gradient(#f6e3d0,#f0d5be)}
.top-bg::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 1px);height:var(--te);background:url(assets/edge2.png) left top/auto 100% repeat-x}
.top-in{position:relative;height:82px;display:flex;align-items:center;justify-content:space-between;max-width:1040px;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .ib{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);border-radius:12px}
.top .logo img{height:60px;width:auto;display:block}
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--th));z-index:45;background:var(--night-2);border-bottom:1px solid var(--line)}
.sbar .wrap{padding-block:12px}

/* ===== 共用元件 ===== */
.tag{display:inline-block;font-family:var(--font-brush);font-weight:700;color:var(--ink);background:linear-gradient(#e9d1b0,#dcbf98);
  padding:.35em 1.3em;transform:rotate(-2deg);letter-spacing:.12em;font-size:1.05rem;line-height:1.4;margin:0;
  clip-path:polygon(1% 18%,5% 4%,12% 12%,24% 2%,38% 10%,52% 0,66% 9%,80% 2%,93% 10%,99% 24%,97% 46%,100% 66%,95% 84%,88% 98%,74% 90%,60% 100%,46% 91%,32% 100%,18% 92%,6% 99%,2% 80%,0 58%,3% 38%)}
.dash{border:0;border-top:1.5px dashed var(--line);margin:28px 0}
.page{padding-block:36px 72px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}html{scroll-behavior:auto}}
.cap{display:block;font-variant-numeric:tabular-nums;letter-spacing:.08em;font-size:.95rem;color:var(--text);margin-top:8px;line-height:1.4}
.cap b{font-weight:500;margin-right:.9em}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;border:1px solid rgba(243,230,214,.35);box-shadow:0 6px 14px rgba(0,0,0,.35);background:var(--night-2)}
.thumb{display:block;min-width:0}

/* ===== 首頁 ===== */
.cover{position:relative;display:flex;justify-content:space-between;align-items:center;max-width:1040px;margin:clamp(20px,5vw,48px) auto 0}
.cover img{display:block}
.cover .cl,.cover .cr{width:30%;height:auto}
.cover .lg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(124px,27%,270px);height:auto}
.hwrap{max-width:760px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:clamp(24px,5vw,48px) 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.scard,.tile{background:linear-gradient(180deg,#fae5d1,#f5d9c2);border:1px solid rgba(190,150,110,.25);border-radius:30px;
  box-shadow:0 10px 22px rgba(120,80,40,.16),inset 0 1px 0 rgba(255,255,255,.65)}
.scard{padding:22px 22px 24px}
.scard h1{font-size:clamp(1.6rem,5vw,2.1rem);font-weight:700;letter-spacing:.06em;margin:0 0 14px;line-height:1.3}
.sform{display:flex;align-items:center;background:#fbe9d8;border:1.5px solid #c9a982;border-radius:999px;padding:4px 4px 4px 22px;gap:8px}
.sform input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;font-size:1.1rem;letter-spacing:.06em;color:var(--ink);padding:12px 0}
.sform input::placeholder{color:#5a4535}
.sform:focus-within{border-color:var(--brown);box-shadow:0 0 0 3px rgba(138,90,43,.2)}
.sform button{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a8743c,#7a4d22);color:#fbe8d5;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(80,50,20,.35)}
.hint{margin:10px 6px 0;font-size:.95rem;color:#8a3b2a;min-height:1.4em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px 8px 22px;min-height:132px;
  font-size:clamp(1.1rem,3.6vw,1.35rem);font-weight:500;letter-spacing:.08em;position:relative;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile small{position:absolute;top:12px;right:16px;font-size:.72rem;background:var(--paper-2);padding:1px 10px;border-radius:999px;letter-spacing:.06em;font-weight:400}
.tile svg{stroke:var(--ink)}
@media (min-width:860px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .hwrap{max-width:900px}
  .tile{min-height:170px}
}

/* ===== 作品頁 ===== */
.work{display:grid;gap:22px;max-width:720px;margin-inline:auto}
.stage{position:relative;background:var(--night-2);border-radius:30px;padding:clamp(16px,4vw,40px);display:grid;place-items:center;box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 10px 24px rgba(0,0,0,.3)}
.stage img{max-width:100%;max-height:62vh;width:auto;height:auto;box-shadow:0 8px 22px rgba(0,0,0,.6)}
.fs{position:absolute;right:16px;bottom:16px;width:44px;height:44px;border-radius:12px;background:rgba(20,16,14,.75);display:grid;place-items:center;color:var(--text)}
.metar{display:grid;grid-template-columns:auto auto;justify-content:end;font-size:.9rem;letter-spacing:.1em;color:var(--muted);line-height:1.9}
.metar b{font-weight:500;white-space:nowrap}
.metar b::after{content:"";display:inline-block;width:1px;height:1em;background:currentColor;opacity:.7;margin:0 12px;vertical-align:-.15em}
.titlerow{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:20px;align-items:center}
.titlerow .num{grid-column:1;grid-row:1}
.titlerow h1{grid-column:2;grid-row:1}
.titlerow .by{grid-column:2;grid-row:2}
.num{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:2.1rem;padding:.2em 1em;letter-spacing:.02em}
.work h1{margin:0;font-size:clamp(1.8rem,6vw,2.4rem);letter-spacing:.1em;line-height:1.3;font-weight:700;text-wrap:balance;min-width:0}
.by{margin:4px 0 0;letter-spacing:.14em;color:var(--text);display:flex;align-items:center;gap:12px;font-size:1.15rem;font-weight:500}
.by .bar{width:1.5px;height:1.1em;background:currentColor;opacity:.85;flex:none}
.by a.nm{border-bottom:1px solid transparent}.by a.nm:hover{border-color:var(--text)}
.by .ico{width:32px;height:32px;display:grid;place-items:center}
.concept{margin:16px 0 0;padding-left:clamp(0px,5vw,40px);padding-right:14px;letter-spacing:.12em;line-height:2;color:var(--text);max-height:10em;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#a89a8c rgba(0,0,0,.4)}
.concept::-webkit-scrollbar{width:10px}
.concept::-webkit-scrollbar-track{background:rgba(0,0,0,.4);border-radius:6px}
.concept::-webkit-scrollbar-thumb{background:#a89a8c;border-radius:6px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.more{display:flex;align-items:center;gap:6px;letter-spacing:.12em;font-size:.95rem}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}


/* ===== 探索作品 ===== */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;background:#f6e3cf;color:var(--ink);border:0;border-radius:999px;padding:14px 46px 14px 24px;font:inherit;font-weight:700;letter-spacing:.1em;box-shadow:0 5px 12px rgba(0,0,0,.3);cursor:pointer;text-overflow:ellipsis}
.sel svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);pointer-events:none;stroke:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 16px}
.grid .thumb img{aspect-ratio:13/10}
.grid .cap{font-size:1.05rem;padding-left:4px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0;letter-spacing:.1em}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:24px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}

/* ===== 創作者 ===== */
.ah{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.ah .tag{align-self:flex-start;font-size:clamp(1.5rem,5vw,2rem);padding:.4em 1.6em;margin-bottom:8px}
.ah p{margin:0;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.alist{display:grid;gap:14px;margin-top:20px}
.page .ah,.page .alist{width:100%;max-width:720px;margin-inline:auto}
.ac{border:1.5px solid rgba(243,230,214,.55);border-radius:26px;background:rgba(0,0,0,.12);scroll-margin-top:130px;transition:border-color .2s}
.ac.hl{border-color:#f0b36b}
.ac-h{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 24px;min-height:68px;width:100%;text-align:left}
.ac-n{font-size:1.55rem;font-weight:500;letter-spacing:.14em;flex:0 1 auto;min-width:0}
.ac-ln{display:flex;gap:12px;align-items:center}
.ac-ln a{display:grid;place-items:center;width:34px;height:34px}
.ac-c{margin-left:auto;display:flex;align-items:center;gap:10px;letter-spacing:.12em;white-space:nowrap}
.ac-c svg{transition:transform .2s}
.ac.open .ac-c svg{transform:rotate(90deg)}
.ac-b{display:none;padding:2px 16px 20px}
.ac.open .ac-b{display:block}
.ac-b .row3{margin-top:6px}
.ac-b .thumb img{aspect-ratio:3/2;border-radius:16px}
.ac-b .cap{font-size:.82rem;letter-spacing:.04em}
.ac-b .cap b{margin-right:.5em}
.ac-head{display:flex;align-items:center;gap:6px;flex:1;min-width:0}

/* ===== 關於 / 紀錄 ===== */
.about{display:grid;gap:8px;max-width:760px;margin-inline:auto}
.atext{display:grid;gap:6px}
.atext p{margin:0;text-wrap:pretty}
.a-h1{font-size:clamp(1.6rem,6vw,2.1rem);font-weight:700;letter-spacing:.14em;line-height:1.6}
.a-h2{font-size:clamp(1.25rem,4.4vw,1.5rem);font-weight:500;letter-spacing:.14em;line-height:1.8}
.a-p{font-size:1rem;font-weight:400;letter-spacing:.14em;line-height:2.1;color:var(--muted)}
.a-gap{height:14px}
.about img{width:100%;border-radius:30px;border:1px solid rgba(243,230,214,.35);box-shadow:0 10px 24px rgba(0,0,0,.35);margin-top:10px}
.tabs{display:flex;position:relative;border-bottom:1.5px dashed var(--line);margin-bottom:22px}
.tabs button{flex:1;padding:12px 0 14px;font-size:clamp(1.25rem,4.4vw,1.6rem);letter-spacing:.12em;position:relative}
.tabs button span{display:inline-block;padding:.15em 1.2em;border-radius:999px;transition:background .2s,color .2s}
.tabs button[aria-selected="true"] span{background:#e3d3c0;color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:18%;right:18%;bottom:-2px;height:4px;border-radius:4px;background:#f3e6d6}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rec button{display:block;border-radius:28px;overflow:hidden;border:1px solid rgba(243,230,214,.35);box-shadow:0 8px 20px rgba(0,0,0,.35);background:var(--night-2);padding:0;text-align:left}
.rec img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.rec button:hover img{transform:scale(1.03)}
.rec button:first-child{grid-column:1/-1}
.rec button:first-child img{aspect-ratio:3/2}
.rec button:not(:first-child) img{aspect-ratio:1/1}
.rec .rc{display:block;font-size:.85rem;color:var(--muted);padding:8px 14px 10px;letter-spacing:.08em}
@media (min-width:860px){.rec{grid-template-columns:repeat(3,1fr)}.rec button:first-child{grid-column:span 2;grid-row:span 2}.rec button:first-child img{aspect-ratio:auto;height:100%}.rec button:not(:first-child) img{aspect-ratio:4/3}}
.soft{text-align:center;padding:56px 12px;color:var(--muted);letter-spacing:.12em;border:1.5px dashed var(--line);border-radius:26px}

/* ===== 找不到 ===== */
.nf{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:24px}
.nf .q{font-family:var(--font-brush);font-size:7rem;line-height:1;color:#b9cde6;opacity:.85}
.nf h1{margin:0;font-size:clamp(1.5rem,5vw,2rem);letter-spacing:.1em;font-weight:500}
.nf p{margin:0;color:var(--muted);letter-spacing:.08em;max-width:30em}
.nf .sform{background:#f6e3cf;width:100%;max-width:440px;margin-top:10px}
.nf .hint{color:#f0b3a3}
.btn{display:inline-block;background:#e3d3c0;color:var(--ink);padding:12px 28px;border-radius:999px;font-weight:700;letter-spacing:.12em;box-shadow:0 5px 12px rgba(0,0,0,.3)}

/* ===== 側選單 / 放大檢視 ===== */
.scrim{position:fixed;inset:0;background:rgba(10,7,5,.6);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,84vw);z-index:80;background:linear-gradient(#f5e0cc,#eed2b8);color:var(--ink);
  padding:calc(env(safe-area-inset-top,0px) + 20px) 24px 24px calc(max(24px,env(safe-area-inset-left,0px)));transform:translateX(-102%);visibility:hidden;transition:transform .25s,visibility .25s}
.drawer.on{transform:none;visibility:visible;box-shadow:8px 0 30px rgba(0,0,0,.4)}
.drawer img{height:54px;width:auto;margin:6px 0 18px;display:block}
.drawer a{display:block;padding:14px 4px;font-size:1.2rem;letter-spacing:.14em;border-bottom:1.5px dashed rgba(43,31,23,.25)}
.drawer a[aria-current="page"]{font-weight:700}
.lb{position:fixed;inset:0;z-index:90;background:rgba(8,6,5,.92);display:none;place-items:center;padding:20px;overflow:hidden;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;touch-action:none;-webkit-user-drag:none;will-change:transform;cursor:zoom-in}
.lb img.smooth{transition:transform .2s ease}
.lb.zoomed img{cursor:grab}
.lb-ctl{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.14)}
.lb-ctl button{position:static;width:auto;min-width:46px;height:46px;padding:0 16px;border-radius:999px;background:none;color:#fff;font-size:1.3rem;line-height:1;letter-spacing:.06em}
.lb [data-act='lbclose']{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.foot{text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.1em;padding:0 16px 40px}

/* ===== 彩蛋 / 展覽之後 ===== */
.tile.wide{grid-column:1/-1;flex-direction:row;min-height:84px;gap:16px;padding:16px}
.ticks{display:block;color:#e8c9a8;flex:none}
.pill{display:inline-flex;align-items:center;gap:12px;background:linear-gradient(#fbe9d6,#f2d9bf);color:var(--ink);font-size:clamp(1.15rem,4.6vw,1.6rem);font-weight:700;letter-spacing:.16em;padding:16px 36px;border-radius:28px;box-shadow:0 8px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.pill.blue{background:linear-gradient(#e6edf5,#d3dfec)}
.af{max-width:640px;margin-inline:auto;display:grid;justify-items:center;gap:16px;text-align:center;padding-top:40px}
.af-title{display:flex;align-items:center;gap:14px;justify-content:center}
.af-title h1{margin:0;font-family:var(--font-brush);font-weight:400;font-size:clamp(3rem,14vw,4.8rem);letter-spacing:.06em;line-height:1.2;color:#f3e6d6}
.af-text{margin:8px 0 14px;font-size:clamp(1.1rem,4.4vw,1.4rem);letter-spacing:.22em;line-height:2;color:#f3e6d6}
.puzzle{position:relative;width:100%;max-width:560px;margin-top:6px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.puzzle svg{display:block;width:100%;height:auto}
.pz{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:clamp(1rem,4.2vw,1.35rem);letter-spacing:.08em;color:var(--ink);padding:0 3%;white-space:nowrap}
.pz-l{left:0;width:49%}
.pz-r{right:0;width:49%;padding-left:8%}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,7,5,.6);display:grid;place-items:center;padding:24px}
.mb{background:linear-gradient(#fbe9d6,#f2d9bf);color:var(--ink);border-radius:26px;padding:28px 26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.5);display:grid;gap:12px}
.mb h2{margin:0;font-size:1.5rem;letter-spacing:.12em}
.mb p{margin:0;letter-spacing:.08em;line-height:1.8}
.mlinks{display:grid;gap:8px;margin-top:4px}
.mlinks a{display:block;background:#fff6ea;border:1.5px solid rgba(43,31,23,.35);padding:10px;border-radius:999px;font-weight:700;letter-spacing:.1em}
.mx{justify-self:center;margin-top:4px;padding:8px 24px;border-radius:999px;background:var(--ink);color:#fbe8d5;font-weight:500;letter-spacing:.1em}
/* ===== 彩蛋影片 / 投稿 / 藝廊 ===== */
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.egg{max-width:760px;display:grid;justify-items:center;gap:22px;padding-top:36px}
.egg-wrap{width:100%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
.egg-stage{position:relative;width:100%;aspect-ratio:16/9;background:#14100e}
.egg-poster{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#f7e4d0,#efd2b7)}

/* ===== 路由 ===== */
var app=document.getElementById("app");
function route(){
  var r=(location.hash||"#home").slice(1), m, html, key="home";
  closeMenu();closeModal();buildDrawer();document.getElementById("sbar").hidden=true;
  var focus="";
  if(r==="home"||r===""){html='';key="home"}
  else if((m=r.match(/^work-(\d+)$/))){var w=byId(m[1]);html=w?viewWork(w):viewNF(m[1]);key="work"}
  else if(r==="works"){html=viewWorks();key="works"}
  else if(r==="artists"){html=viewArtists();key="artists"}
  else if((m=r.match(/^artist-(\w+)$/))){focus=m[1];openA[focus]=true;html=viewArtists(focus);key="artists"}
  else if(r==="about"){html=viewAbout();key="about"}
  else if(r==="records"){html=viewRecords();key="records"}
  else if(r==="status"){html=viewStatus();key="status"}
  else if(r==="egg"){if(afterOpen()){pendingEgg=true;location.replace("#home");return}html=viewEgg();key="egg"}
  else if(r==="after"){html=viewAfter();key="after"}
  else if(r==="join"){html=viewJoin();key="join"}
  else if(r==="gallery"){html=viewGallery();key="gallery"}
  else if((m=r.match(/^gal-([\w-]+)$/))){var gg=galBySlug(m[1]);html=gg?viewGalWork(gg):'<div class="wrap page"><div class="soft">找不到這幅作品<br><br><a class="btn" href="#gallery">回到藝廊</a></div></div>';key="galwork"}
  else if((m=r.match(/^notfound-(\d*)$/))){html=viewNF(m[1]);key="nf"}
  else {r="home";html='';key="home"}
  document.body.setAttribute("data-route",key==="home"?"home":"page");
  document.getElementById("top").style.display=key==="home"?"none":"";
  app.innerHTML = key==="home"?viewHome():html;
  document.querySelectorAll("#drawer a").forEach(function(a){var t=a.getAttribute("data-nav");a.setAttribute("aria-current",(t===r||(t==="artists"&&key==="artists")||(t==="works"&&key==="work")||(t==="home"&&key==="home"))?"page":"false")});
  if(focus){var el=document.getElementById("artist-"+focus);if(el)setTimeout(function(){el.scrollIntoView({block:"start"})},30)}else window.scrollTo(0,0);
  var q=document.querySelector("#app input[inputmode]");if(q&&key==="nf")q.focus({preventScroll:true});
  if(key==="egg")initEgg();
  if(key==="join")initJoin();
  if(key==="gallery")initGallery();
  if(pendingEgg&&key==="home"){pendingEgg=false;eggEnd()}
}
window.addEventListener("hashchange",route);

/* ===== 搜尋:全形轉半形、只留數字、補零到 3 碼 ===== */
function goSearch(raw,form){
  var d=String(raw).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}).replace(/\D/g,"");
  var hint=form.parentNode.querySelector(".hint");
  if(!d){if(hint)hint.textContent="請輸入作品旁的數字編號,例如 012";return}
  var id=d.length<3?("000"+d).slice(-3):d;
  if(id==="000"){if(hint)hint.textContent="";if(afterOpen())eggEnd();else if(location.hash==="#egg")route();else location.hash="egg";return}
  var target=byId(id)?("work-"+id):("notfound-"+id);
  if(location.hash==="#"+target)route();else location.hash=target;
}

var drawer=document.getElementById("drawer"),scrim=document.getElementById("scrim"),lb=document.getElementById("lb");
function closeMenu(){drawer.classList.remove("on");scrim.classList.remove("on");drawer.setAttribute("aria-hidden","true");var b=document.querySelector('[data-act="menu"]');if(b)b.setAttribute("aria-expanded","false")}
function openLB(src,lo){zReset();zImg.src=lo||src;if(lo&&lo!==src){var t=new Image();t.onload=function(){if(lb.classList.contains("on"))zImg.src=src};t.src=src}lb.classList.add("on");document.body.style.overflow="hidden";zApply()}

/* ===== 放大檢視:雙指縮放、滾輪縮放、拖曳平移、雙擊切換、按鈕 ===== */
var Z={s:1,x:0,y:0,moved:false},zImg=lb.querySelector('img'),zP={},zLast=null,zPinch=null;
function zApply(smooth){
  var vw=lb.clientWidth,vh=lb.clientHeight,w=zImg.clientWidth*Z.s,hh=zImg.clientHeight*Z.s;
  var mx=Math.max(0,(w-vw)/2),my=Math.max(0,(hh-vh)/2);
  Z.x=Math.min(mx,Math.max(-mx,Z.x));Z.y=Math.min(my,Math.max(-my,Z.y));
  zImg.classList.toggle('smooth',!!smooth);
  zImg.style.transform='translate('+Z.x+'px,'+Z.y+'px) scale('+Z.s+')';
  lb.classList.toggle('zoomed',Z.s>1.02);
}
function zReset(smooth){Z.s=1;Z.x=0;Z.y=0;Z.moved=false;zP={};zPinch=null;zApply(smooth)}
function zoomAt(ns,px,py,smooth){
  ns=Math.min(5,Math.max(1,ns));
  var r=lb.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,k=ns/Z.s;
  Z.x=(px-cx)-((px-cx)-Z.x)*k;Z.y=(py-cy)-((py-cy)-Z.y)*k;Z.s=ns;
  if(ns===1){Z.x=0;Z.y=0}
  zApply(smooth);
}
function zoomBy(f){var r=lb.getBoundingClientRect();zoomAt(Z.s*f,r.left+r.width/2,r.top+r.height/2,true)}
function zPts(){return Object.keys(zP).map(function(k){return zP[k]})}
function zDist(){var a=zPts();return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1}
lb.addEventListener('pointerdown',function(e){
  if(e.target.closest('button'))return;
  zP[e.pointerId]={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};
  Z.moved=false;zImg.classList.remove('smooth');
  if(Object.keys(zP).length===2){var a=zPts();zPinch={d:zDist(),s:Z.s,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2}}
});
window.addEventListener('pointermove',function(e){
  var p=zP[e.pointerId];if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(Math.abs(e.clientX-p.sx)+Math.abs(e.clientY-p.sy)>8)Z.moved=true;
  p.x=e.clientX;p.y=e.clientY;
  if(Object.keys(zP).length===2&&zPinch){
    var a=zPts(),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
    Z.x+=mx-zPinch.mx;Z.y+=my-zPinch.my;zPinch.mx=mx;zPinch.my=my;
    zoomAt(zPinch.s*zDist()/zPinch.d,mx,my);
  }else if(Object.keys(zP).length===1&&Z.s>1.02){Z.x+=dx;Z.y+=dy;zApply()}
});
function zUp(e){
  if(!zP[e.pointerId])return;
  delete zP[e.pointerId];zPinch=null;
  var n=Object.keys(zP).length;
  if(n===0&&!Z.moved&&e.type==='pointerup'&&e.target===zImg){
    var t=Date.now();
    if(zLast&&t-zLast.t<320&&Math.abs(zLast.x-e.clientX)<30&&Math.abs(zLast.y-e.clientY)<30){
      zLast=null;if(Z.s>1.02)zReset(true);else zoomAt(2.5,e.clientX,e.clientY,true);
    }else zLast={t:t,x:e.clientX,y:e.clientY};
  }
  if(n===1){var q=zPts()[0];q.sx=q.x;q.sy=q.y}
}
window.addEventListener('pointerup',zUp);window.addEventListener('pointercancel',zUp);
lb.addEventListener('wheel',function(e){
  e.preventDefault();zImg.classList.remove('smooth');
  zoomAt(Z.s*Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)),e.clientX,e.clientY);
},{passive:false});

/* ===== 彩蛋(首頁輸入 000)與「展覽之後」=====

   之後 → 首頁出現「展覽之後」按鈕,輸入 000 只跳出提示。 */
var pendingEgg=false;
function todayTW(){return new Date(Date.now()+480*60000).toISOString().slice(0,10)}
function afterDate(){var m=String(DB.site.after_date||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m?m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2):'2026-12-06'}
function afterOpen(){return todayTW()>=afterDate()}
var modal=document.getElementById('modal');
function showModal(t,msg,links){
  modal.querySelector('.mb').innerHTML='<h2>'+h(t)+'</h2><p>'+h(msg)+'</p>'+
    (links&&links.length?'<div class="mlinks">'+links.map(function(l){return '<a href="'+l[0]+'">'+h(l[1])+'</a>'}).join('')+'</div>':'')+
    '<button type="button" class="mx" data-act="mclose">知道了</button>';

function closeModal(){modal.hidden=true}
function eggEnd(){showModal('彩蛋結束囉','可以到「關於展覽」跟「展覽之後」去看內容',[['#about','關於展覽'],['#after','展覽之後']])}
function tornBox(n,a,seed){var s=seed,r=function(){s=(s*9301+49297)%233280;return s/233280},p=[],i;
  for(i=0;i<=n;i++)p.push((i/n*100).toFixed(1)+'% '+(r()*a).toFixed(1)+'%');
  for(i=1;i<=n;i++)p.push((100-r()*a).toFixed(1)+'% '+(i/n*100).toFixed(1)+'%');
  for(i=n-1;i>=0;i--)p.push((i/n*100).toFixed(1)+'% '+(100-r()*a).toFixed(1)+'%');
  for(i=n-1;i>=1;i--)p.push((r()*a).toFixed(1)+'% '+(i/n*100).toFixed(1)+'%');
  return 'polygon('+p.join(',')+')'}
function ticksUp(){return '<svg class="ticks" width="84" height="44" viewBox="0 0 84 44" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M42 6v14M18 12l8 12M66 12l-8 12"/></svg>'}

/* ---- 彩蛋頁:影片播完才出現兩顆按鈕 ---- */

function eggDone(){

function toJpeg(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*r),hh=Math.round(img.naturalHeight*r),c=document.createElement('canvas');
      c.width=w;c.height=hh;c.getContext('2d').drawImage(img,0,0,w,hh);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}

/* ---- 藝廊:一次三幅,左右滑換頁,椅子不動 ---- */
var galPage=0;
function gSlug(g){return g.slug||String(g.id||'').replace(/[^\w-]/g,'')}
function galBySlug(s){return (DB.gallery||[]).filter(function(g){return gSlug(g)===s})[0]}
var LAMP='<svg class="glamp" viewBox="0 0 60 40" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0ab55"/><stop offset="1" stop-color="#a8742e"/></linearGradient></defs><path d="M8 30C8 14 20 8 30 8s22 6 22 22z" fill="url(#lg1)"/><rect x="4" y="29" width="52" height="5" rx="2.5" fill="#85592a"/><ellipse cx="30" cy="36" rx="9" ry="3.5" fill="#ffe3a8"/></svg>';
var GAL_N_PHONE=2; /* 手機一次顯示幾幅(想改回 3 幅就改這個數字) */
function galN(){var w=window.innerWidth;return w>=1500?5:w>=1000?4:w>=640?3:GAL_N_PHONE}
function viewGallery(){
  var N=galN(),items=DB.gallery||[],pages=Math.max(1,Math.ceil(items.length/N)),slots='',i,g;
  if(galPage>pages-1)galPage=0;
  for(i=0;i<pages*N;i++){
    g=items[i];
    var sn=i%N===0?' sn':'';if(!g){slots+='<div class="gslot empty'+sn+'" aria-hidden="true"></div>';continue}
    slots+='<a class="gslot'+sn+'" href="#gal-'+h(gSlug(g))+'"><span class="gfw">'+LAMP+'<span class="gframe"><img onload="galFit(this)" src="'+h(U(g.image,800))+'" alt="'+h(g.title||g.nickname)+'" loading="lazy" draggable="false"></span></span><span class="gplaq">· '+h(g.nickname)+' ·</span></a>';
  }
  var dots='';for(i=0;i<pages;i++)dots+='<button type="button" class="gdot" aria-label="第 '+(i+1)+' 頁"></button>';
  return '<div class="gscene"><div class="gwall"></div><div class="gfloor"></div>'+
    (items.length?'':'<p class="gempty">作品即將上牆</p>')+
    '<div class="gtrack" id="galTrack" data-n="'+N+'" style="--n:'+N+'" data-pages="'+pages+'">'+slots+'</div>'+
    '<button type="button" class="gnav prev" id="galPrev" aria-label="上一頁">'+sv('<path d="m15 5-7 7 7 7"/>',24,2.6)+'</button>'+
    '<button type="button" class="gnav next" id="galNext" aria-label="下一頁">'+sv('<path d="m9 5 7 7-7 7"/>',24,2.6)+'</button>'+
    '<div class="gdots">'+dots+'</div></div>';
}
function galFit(i){var r=i.naturalWidth/i.naturalHeight;if(!(r>0))return;r=Math.max(.75,Math.min(1.35,r));i.parentNode.style.aspectRatio=r;i.parentNode.style.width='min(92%,calc(var(--fh)*'+(.75*Math.max(1,r)).toFixed(3)+'))';}
function initGallery(){
  var t=document.getElementById('galTrack');if(!t)return;
  var pages=+t.getAttribute('data-pages')||1,prev=document.getElementById('galPrev'),next=document.getElementById('galNext'),dots=[].slice.call(document.querySelectorAll('.gdot')),tick=null;
  function cur(){return Math.max(0,Math.min(pages-1,Math.round(t.scrollLeft/(t.clientWidth||1))))}
  function sync(){var p=cur();galPage=p;dots.forEach(function(d,i){d.classList.toggle('on',i===p);d.setAttribute('aria-current',i===p?'true':'false')});prev.disabled=p<=0;next.disabled=p>=pages-1}
  function go(p){t.scrollTo({left:Math.max(0,Math.min(pages-1,p))*t.clientWidth,behavior:'smooth'})}
  t.scrollLeft=galPage*t.clientWidth;
  var n0=galN();window.addEventListener('resize',function onr(){if(!document.getElementById('galTrack')){window.removeEventListener('resize',onr);return}clearTimeout(onr.t);onr.t=setTimeout(function(){if(galN()!==n0){var f=galPage*n0;galPage=Math.floor(f/galN());window.removeEventListener('resize',onr);route()}},200)});
  t.addEventListener('scroll',function(){if(tick)return;tick=requestAnimationFrame(function(){tick=null;sync()})});
  prev.addEventListener('click',function(){go(cur()-1)});next.addEventListener('click',function(){go(cur()+1)});
  dots.forEach(function(d,i){d.addEventListener('click',function(){go(i)})});
  sync();
}

/* ===== 資料來源:Google 試算表(已設為「知道連結的人可檢視」)=====
   讀取順序:瀏覽器快取 → 試算表即時資料;兩者都失敗時使用上面的範例資料。 */
var STATUS={src:"範例資料",msg:"尚未連線"};
var CFG={sheetId:"1I0U6nRu2aj06ef7hcYDE_h46YoNjAhaqVqjAm_6lVZQ",cacheKey:"expo-data-v1"};
function parseCSV(t){var rows=[],r=[],f="",q=false,i=0,c;t=t.replace(/^﻿/,"");
  for(;i<t.length;i++){c=t.charAt(i);
    if(q){if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){r.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t.charAt(i+1)==="\n")i++;r.push(f);f="";rows.push(r);r=[]}
    else f+=c}
  if(f!==""||r.length){r.push(f);rows.push(r)}return rows}
function toObjs(rows){if(rows.length>1&&rows[0].every(function(x){return /^[A-Z]{0,2}$/.test(x.trim())}))rows=rows.slice(1);if(!rows.length)return [];var hd=rows[0].map(function(x){return x.trim().toLowerCase()});
  var res=rows.slice(1).filter(function(r){return r.some(function(x){return x.trim()})}).map(function(r){var o={};hd.forEach(function(k,i){o[k]=(r[i]||"").trim()});return o});res.cols=hd;return res}
function fetchTab(n){return fetch("https://docs.google.com/spreadsheets/d/"+CFG.sheetId+"/gviz/tq?tqx=out:csv&headers=1&sheet="+encodeURIComponent(n))
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(function(t){return toObjs(parseCSV(t))})}
function hasCols(rows,keys){return rows.length>0&&keys.every(function(k){return k in rows[0]})}
function pad3(s){s=String(s||"").trim();return /^\d+$/.test(s)&&s.length<3?("000"+s).slice(-3):s}
function galFrom(GA){
  if(!GA||!GA.cols||GA.cols.indexOf("nickname")<0||GA.cols.indexOf("image")<0)return SAMPLE.gallery;
  var yes=/^(true|1|y|yes|是|✓|v)$/i,no=/^(false|0|n|no|否)$/i;
  return GA.filter(function(g){return g.image&&g.nickname&&yes.test(g.approved||"")&&!no.test(g.consent||"")})
    .map(function(g,i){g.slug=String(g.id||("r"+(i+1))).replace(/[^\w-]/g,"");return g});
}
function buildDB(W,AR,RE,SI,GA){
  if(!hasCols(W,["id","title","artist_id","image"])||!hasCols(AR,["artist_id","name"]))throw new Error("欄位不符");
  var site={};for(var k in SAMPLE.site)site[k]=SAMPLE.site[k];
  SI.forEach(function(r){if(r.key&&r.value)site[r.key]=r.value});
  site.total_artists=parseInt(site.total_artists,10)||AR.length;
  return {site:site,
    artists:AR.filter(function(a){return a.artist_id&&a.name}),
    works:W.filter(function(w){return w.id&&w.title}).map(function(w){w.id=pad3(w.id);w.medium_type=w.medium_type||w.medium;return w}),
    gallery:galFrom(GA),
    records:RE.filter(function(r){return r.image}).map(function(r,i){return {type:r.type==="活動"?"活動":"展場",image:r.image,caption:r.caption||"",order:parseFloat(r.order)||i+1}})};
}
function applyDB(next,fromCache){
  if(JSON.stringify(next)===JSON.stringify(DB))return;
  DB=next;buildTop();route();
}
function loadData(){
  try{var c=JSON.parse(localStorage.getItem(CFG.cacheKey)||"null");if(c&&c.data&&c.data.works){DB=c.data}}catch(e){}
  return Promise.all([fetchTab("works"),fetchTab("artists"),fetchTab("records").catch(function(){return []}),fetchTab("site").catch(function(){return []}),fetchTab("gallery").catch(function(){return []})])
   .then(function(a){var next=buildDB(a[0],a[1],a[2],a[3],a[4]);STATUS={src:"試算表(即時)",msg:"works "+a[0].length+" 筆、artists "+a[1].length+" 筆、records "+a[2].length+" 筆、site "+a[3].length+" 列、gallery "+a[4].length+" 筆(含未核准)"};try{localStorage.setItem(CFG.cacheKey,JSON.stringify({t:Date.now(),data:next}))}catch(e){}applyDB(next)})
   .catch(function(e){STATUS={src:"範例/快取資料",msg:"讀取試算表失敗:"+(e&&e.message)};console.info("使用範例/快取資料:",e&&e.message)}).then(function(){if(location.hash==="#status")route()});
}

buildTop();
route();
loadData();
</script>
